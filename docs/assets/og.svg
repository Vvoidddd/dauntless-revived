<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Social preview card for the Dauntless Revived docs site. Original artwork: text and simple shapes only, no game art.
       Render: rsvg-convert -w 1200 -h 630 og.svg -o og.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#1b2733"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b134"/>
      <stop offset="1" stop-color="#e8743b"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Motif: a ring with a pulse line running through it ("revived"). -->
  <g transform="translate(930 262)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle r="178" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    <circle r="136" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <circle r="136" stroke="url(#accent)" stroke-width="6" stroke-dasharray="610 245" transform="rotate(-120)"/>
    <polyline points="-250,0 -92,0 -64,-20 -40,0 -22,0 0,-86 26,78 48,-30 64,0 250,0"
              stroke="url(#accent)" stroke-width="7"/>
    <circle cx="250" cy="0" r="7" fill="#e8743b" stroke="none"/>
  </g>

  <rect x="80" y="84" width="72" height="6" rx="3" fill="url(#accent)"/>

  <text x="80" y="140" font-family="JetBrains Mono" font-size="24" font-weight="500" letter-spacing="2" fill="#f2b134">PRIVATE SERVER REVIVAL · CLIENT 1.4.4</text>

  <text x="76" y="252" font-family="Inter" font-size="100" font-weight="800" letter-spacing="-2" fill="#ffffff">Dauntless</text>
  <text x="76" y="360" font-family="Inter" font-size="100" font-weight="800" letter-spacing="-2" fill="#ffffff">Revived</text>

  <text font-family="Inter" font-size="30" font-weight="400" fill="#c9d4df">
    <tspan x="80" y="432">The genuine Dauntless 1.4.4 client, running against</tspan>
    <tspan x="80" y="474">a self-hosted fork of the open-source Undaunted server.</tspan>
  </text>

  <line x1="80" y1="530" x2="1120" y2="530" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <text x="80" y="574" font-family="JetBrains Mono" font-size="24" fill="#ffffff">mixutin.github.io/dauntless-revived</text>
  <text x="1120" y="574" text-anchor="end" font-family="Inter" font-size="20" fill="#8a9aab">Unofficial fan project · AGPL-3.0 · no game files</text>
</svg>
