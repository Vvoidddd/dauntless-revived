# Builds the Windows launcher from a tag such as launcher-v0.2.0 and publishes it:
#  - a versioned GitHub release with the installer, the portable zip and SHA256SUMS.txt
#  - the rolling "launcher-updates" release, which installed launchers read to update themselves
#    (Squirrel RELEASES file + the newest full package; see UPDATE_FEED_URL in
#    UndauntedLauncher/src/main/constants.ts)
#
# The version in UndauntedLauncher/package.json must match the tag. Actions are pinned by commit.
name: Launcher release

on:
  push:
    tags:
      - "launcher-v*"

permissions: {}

concurrency:
  group: launcher-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
        working-directory: UndauntedLauncher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: UndauntedLauncher/package-lock.json

      - name: Check that the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "launcher-v$version") { throw "Tag $env:TAG does not match package.json version $version" }

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the installer
        run: npm run make

      - name: Collect the release files and their SHA-256 sums
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item out/make/squirrel.windows/x64/* release/
          Copy-Item out/make/zip/win32/x64/*.zip release/
          $sums = Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          Set-Content -Path release/SHA256SUMS.txt -Value $sums -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launcher-release
          path: UndauntedLauncher/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: launcher-release
          path: release

      - name: Create the versioned release
        run: |
          version="${TAG#launcher-v}"
          cat > notes.md <<EOF
          Dauntless Revived Launcher ${version} for Windows.

          - Installer: \`DauntlessRevivedLauncher-Setup.exe\`
          - Portable: the \`.zip\`
          - Check your download against \`SHA256SUMS.txt\`.

          The launcher is not code-signed yet, so Windows SmartScreen may ask you to confirm
          (More info, then Run anyway). Installed launchers update themselves.

          Free software under the GNU AGPL-3.0. No game files are included: the launcher downloads
          them from your host's server and checks every file against the list built into it.
          EOF
          gh release create "$TAG" release/* --verify-tag --title "Launcher ${version}" --notes-file notes.md

      - name: Update the self-update feed
        run: |
          feed=launcher-updates
          if ! gh release view "$feed" >/dev/null 2>&1; then
            gh release create "$feed" --prerelease --title "Launcher update feed" \
              --notes "Used by installed launchers to update themselves. Download the launcher from the latest launcher-v* release instead."
          fi
          pkg="$(basename "$(ls release/*-full.nupkg)")"
          # New package first, then RELEASES, so the feed never points at a missing file.
          gh release upload "$feed" "release/$pkg" --clobber
          gh release upload "$feed" release/RELEASES --clobber
          gh release view "$feed" --json assets --jq '.assets[].name' | while read -r asset; do
            if [ "$asset" != "RELEASES" ] && [ "$asset" != "$pkg" ]; then
              gh release delete-asset "$feed" "$asset" --yes
            fi
          done
