<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Dauntless Revived</title>
  <desc id="banner-desc">Dauntless Revived: a private-server revival of Dauntless 1.4.4. Play the genuine client on a server you host yourself. A fork of Undaunted by gwog and contributors, AGPL-3.0. Unofficial fan project, not affiliated with Phoenix Labs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#110d09"/>
      <stop offset="1" stop-color="#1d150d"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.85" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember2" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#ea580c" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="0.45" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fef3c7" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#ember)"/>
  <rect width="1280" height="320" fill="url(#ember2)"/>

  <!-- heartbeat trace into a server node (original graphic) -->
  <path d="M880 130H990l10-8l8 8H1020l8 16l14-90l14 104l10-30H1100l14-14l14 14H1168" fill="none" stroke="url(#trace)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="1182" cy="130" r="36" fill="none" stroke="#fcd34d" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="1182" cy="130" r="22" fill="none" stroke="#fcd34d" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="1182" cy="130" r="10" fill="#fcd34d"/>
  <rect x="1140" y="180" width="84" height="12" rx="3" fill="#2a1f14" stroke="#4a3520"/>
  <rect x="1140" y="198" width="84" height="12" rx="3" fill="#2a1f14" stroke="#4a3520"/>
  <circle cx="1152" cy="186" r="2.5" fill="#34d399"/>
  <circle cx="1152" cy="204" r="2.5" fill="#34d399"/>

  <text x="64" y="86" class="mono" font-size="15" font-weight="600" letter-spacing="4" fill="#f59e0b">PRIVATE SERVER REVIVAL · DAUNTLESS 1.4.4</text>
  <text x="60" y="168" class="sans" font-size="76" font-weight="800" fill="#fff7ed">Dauntless Revived</text>
  <text x="64" y="220" class="sans" font-size="26" fill="#e7d8c4">Play the genuine Dauntless 1.4.4 client on a server you host yourself.</text>
  <text x="64" y="270" class="mono" font-size="15" fill="#9c8b76">fork of Undaunted by gwog &amp; contributors · AGPL-3.0 · unofficial fan project, not affiliated with Phoenix Labs</text>
</svg>
